# CD — build, push, deploy on tags or main.
# §4: Workload Identity Federation; no long-lived service-account keys.
name: cd
# Manual dispatch only until GCP Workload Identity Federation secrets are
# wired (GCP_WIF_PROVIDER, GCP_CI_SA, GCP_PROJECT, TF_STATE_BUCKET). Push-on-
# main is disabled to avoid red builds without those secrets. Tag-gated prod
# remains available via workflow_dispatch → env=prod.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      env:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

env:
  REGION: europe-west2
  REPO: rpc-estimator

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_scoring_api:    ${{ steps.meta.outputs.scoring_api }}
      image_reconciliation: ${{ steps.meta.outputs.reconciliation }}
      image_activation:     ${{ steps.meta.outputs.activation }}
      image_breaker:        ${{ steps.meta.outputs.breaker }}
      image_ml_pipeline:    ${{ steps.meta.outputs.ml_pipeline }}
      image_mock_vertex:    ${{ steps.meta.outputs.mock_vertex }}
      image_dashboard:      ${{ steps.meta.outputs.dashboard }}
      image_breaker_agent:  ${{ steps.meta.outputs.breaker_agent }}
      image_bounds_agent:   ${{ steps.meta.outputs.bounds_agent }}
      image_drift_agent:    ${{ steps.meta.outputs.drift_agent }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account:            ${{ secrets.GCP_CI_SA }}
          create_credentials_file:    true

      - uses: google-github-actions/setup-gcloud@v2
      - name: configure artifact registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - id: meta
        env: { SHA: "${{ steps.sha.outputs.short }}" }
        run: |
          base="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${REPO}"
          echo "scoring_api=${base}/scoring-api:${SHA}"       >> "$GITHUB_OUTPUT"
          echo "reconciliation=${base}/reconciliation:${SHA}" >> "$GITHUB_OUTPUT"
          echo "activation=${base}/activation:${SHA}"         >> "$GITHUB_OUTPUT"
          echo "breaker=${base}/breaker-automation:${SHA}"    >> "$GITHUB_OUTPUT"
          echo "ml_pipeline=${base}/ml-pipeline:${SHA}"       >> "$GITHUB_OUTPUT"
          echo "mock_vertex=${base}/mock-vertex:${SHA}"       >> "$GITHUB_OUTPUT"
          echo "dashboard=${base}/dashboard:${SHA}"           >> "$GITHUB_OUTPUT"
          echo "breaker_agent=${base}/breaker-agent:${SHA}"   >> "$GITHUB_OUTPUT"
          echo "bounds_agent=${base}/bounds-agent:${SHA}"     >> "$GITHUB_OUTPUT"
          echo "drift_agent=${base}/drift-agent:${SHA}"       >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: build scoring-api
        uses: docker/build-push-action@v6
        with:
          context: services/scoring-api
          push: true
          tags: ${{ steps.meta.outputs.scoring_api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build reconciliation
        uses: docker/build-push-action@v6
        with: { context: services/reconciliation, push: true, tags: "${{ steps.meta.outputs.reconciliation }}" }

      - name: build activation
        uses: docker/build-push-action@v6
        with: { context: services/activation, push: true, tags: "${{ steps.meta.outputs.activation }}" }

      - name: build breaker-automation
        uses: docker/build-push-action@v6
        with: { context: services/breaker-automation, push: true, tags: "${{ steps.meta.outputs.breaker }}" }

      - name: build ml-pipeline
        uses: docker/build-push-action@v6
        with: { context: services/ml-pipeline, push: true, tags: "${{ steps.meta.outputs.ml_pipeline }}" }

      - name: build mock-vertex
        uses: docker/build-push-action@v6
        with: { context: services/mock-vertex, push: true, tags: "${{ steps.meta.outputs.mock_vertex }}" }

      - name: build dashboard
        uses: docker/build-push-action@v6
        with: { context: dashboard, push: true, tags: "${{ steps.meta.outputs.dashboard }}" }

      # Reasoning agents (ADR 0005) — separate images from the deterministic
      # service/job images (Dockerfile.agent installs the agent extras + uvicorn).
      - name: build breaker-agent
        uses: docker/build-push-action@v6
        with: { context: services/breaker-automation, file: services/breaker-automation/Dockerfile.agent, push: true, tags: "${{ steps.meta.outputs.breaker_agent }}" }

      - name: build bounds-agent
        uses: docker/build-push-action@v6
        with: { context: services/bounds-calibration, file: services/bounds-calibration/Dockerfile.agent, push: true, tags: "${{ steps.meta.outputs.bounds_agent }}" }

      - name: build drift-agent
        uses: docker/build-push-action@v6
        with: { context: services/ml-pipeline, file: services/ml-pipeline/Dockerfile.agent, push: true, tags: "${{ steps.meta.outputs.drift_agent }}" }

  deploy-staging:
    needs: build-push
    # Staging runs on: tag push, push to main, or manual dispatch (any env).
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account:            ${{ secrets.GCP_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
      - name: terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # The dashboard service was first deployed via gcloud (pre-Terraform).
      # Import it on the first CD run that knows about it; idempotent thereafter.
      - name: import pre-existing dashboard (one-time, idempotent)
        working-directory: infra/terraform
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: europe-west2
          ENV: staging
        run: |
          set -e
          svc_addr='google_cloud_run_v2_service.dashboard[0]'
          iam_addr='google_cloud_run_v2_service_iam_member.dashboard_public[0]'
          svc_id="projects/${PROJECT}/locations/${REGION}/services/dashboard-${ENV}"
          iam_id="${svc_id} roles/run.invoker allUsers"
          if ! terraform state list | grep -qx "${svc_addr}"; then
            echo "Importing ${svc_addr} ..."
            terraform import \
              -var-file=envs/staging.tfvars \
              -var "image_scoring_api=${{ needs.build-push.outputs.image_scoring_api }}" \
              -var "image_reconciliation=${{ needs.build-push.outputs.image_reconciliation }}" \
              -var "image_activation=${{ needs.build-push.outputs.image_activation }}" \
              -var "image_breaker=${{ needs.build-push.outputs.image_breaker }}" \
              -var "image_ml_pipeline=${{ needs.build-push.outputs.image_ml_pipeline }}" \
              -var "image_mock_vertex=${{ needs.build-push.outputs.image_mock_vertex }}" \
              -var "image_dashboard=${{ needs.build-push.outputs.image_dashboard }}" \
              -var "project_id=${PROJECT}" -var "env=${ENV}" -var "region=${REGION}" \
              "${svc_addr}" "${svc_id}" || echo "import already done or service missing"
          fi
          if ! terraform state list | grep -qx "${iam_addr}"; then
            echo "Importing ${iam_addr} ..."
            terraform import \
              -var-file=envs/staging.tfvars \
              -var "image_scoring_api=${{ needs.build-push.outputs.image_scoring_api }}" \
              -var "image_reconciliation=${{ needs.build-push.outputs.image_reconciliation }}" \
              -var "image_activation=${{ needs.build-push.outputs.image_activation }}" \
              -var "image_breaker=${{ needs.build-push.outputs.image_breaker }}" \
              -var "image_ml_pipeline=${{ needs.build-push.outputs.image_ml_pipeline }}" \
              -var "image_mock_vertex=${{ needs.build-push.outputs.image_mock_vertex }}" \
              -var "image_dashboard=${{ needs.build-push.outputs.image_dashboard }}" \
              -var "project_id=${PROJECT}" -var "env=${ENV}" -var "region=${REGION}" \
              "${iam_addr}" "${iam_id}" || echo "import already done or service missing"
          fi

      # predictions_vs_revenue view was created out-of-band via the SQL
      # template in services/reconciliation/sql/ before it was added to
      # Terraform. Import it on first apply that has the resource;
      # idempotent thereafter.
      - name: import pre-existing predictions_vs_revenue view (one-time, idempotent)
        working-directory: infra/terraform
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          ENV: staging
        run: |
          set -e
          view_addr='google_bigquery_table.predictions_vs_revenue_view'
          view_id="projects/${PROJECT}/datasets/rpc_estimator_${ENV}/tables/predictions_vs_revenue"
          if ! terraform state list | grep -qx "${view_addr}"; then
            echo "Importing ${view_addr} ..."
            terraform import \
              -var-file=envs/staging.tfvars \
              -var "image_scoring_api=${{ needs.build-push.outputs.image_scoring_api }}" \
              -var "image_reconciliation=${{ needs.build-push.outputs.image_reconciliation }}" \
              -var "image_activation=${{ needs.build-push.outputs.image_activation }}" \
              -var "image_breaker=${{ needs.build-push.outputs.image_breaker }}" \
              -var "image_ml_pipeline=${{ needs.build-push.outputs.image_ml_pipeline }}" \
              -var "image_mock_vertex=${{ needs.build-push.outputs.image_mock_vertex }}" \
              -var "image_dashboard=${{ needs.build-push.outputs.image_dashboard }}" \
              -var "project_id=${PROJECT}" -var "env=${ENV}" -var "region=europe-west2" \
              "${view_addr}" "${view_id}" || echo "import already done or view missing"
          fi

      - name: terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_project_id:           ${{ vars.GCP_PROJECT }}
          TF_VAR_region:               europe-west2
          TF_VAR_env:                  staging
          TF_VAR_image_scoring_api:    ${{ needs.build-push.outputs.image_scoring_api }}
          TF_VAR_image_reconciliation: ${{ needs.build-push.outputs.image_reconciliation }}
          TF_VAR_image_activation:     ${{ needs.build-push.outputs.image_activation }}
          TF_VAR_image_breaker:        ${{ needs.build-push.outputs.image_breaker }}
          TF_VAR_image_ml_pipeline:    ${{ needs.build-push.outputs.image_ml_pipeline }}
          TF_VAR_image_mock_vertex:    ${{ needs.build-push.outputs.image_mock_vertex }}
          TF_VAR_image_dashboard:      ${{ needs.build-push.outputs.image_dashboard }}
          # Reasoning agents (ADR 0005) — opt-in via repo var DEPLOY_AGENTS=true.
          # Defaults to false so nothing deploys (or costs) until flipped on.
          TF_VAR_deploy_agents:        ${{ vars.DEPLOY_AGENTS || 'false' }}
          TF_VAR_image_breaker_agent:  ${{ needs.build-push.outputs.image_breaker_agent }}
          TF_VAR_image_bounds_agent:   ${{ needs.build-push.outputs.image_bounds_agent }}
          TF_VAR_image_drift_agent:    ${{ needs.build-push.outputs.image_drift_agent }}
        run: |
          terraform apply -auto-approve -lock-timeout=5m -var-file=envs/staging.tfvars

      - name: post-deploy smoke
        working-directory: infra/terraform
        run: |
          URL=$(terraform output -raw scoring_api_url)
          echo "scoring-api: $URL"
          bash ../../ops/smoke.sh "$URL"
          DASH=$(terraform output -raw dashboard_url || echo "")
          if [ -n "$DASH" ]; then
            echo "dashboard:  $DASH"
            curl -fsS -o /dev/null "$DASH/" && echo "  / ok"
          fi

  deploy-client-cc:
    # PRD V2 §6.2: Credit Cards client-isolated env. Opt-in:
    # set repo variable DEPLOY_CLIENT_CC=true once OQ-1 resolves
    # (client GCP project decision) and the secrets are wired:
    #   GCP_WIF_PROVIDER_CLIENT_CC, GCP_CI_SA_CLIENT_CC,
    #   vars.GCP_PROJECT_CLIENT_CC, secrets.TF_STATE_BUCKET_CLIENT_CC
    # Until then, the job is a no-op so the workflow file stays in main
    # without surprising the staging-only CD.
    needs: [build-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_CLIENT_CC == 'true'
    runs-on: ubuntu-latest
    environment: client-cc  # GitHub environment approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_CLIENT_CC }}
          service_account:            ${{ secrets.GCP_CI_SA_CLIENT_CC }}
      - uses: hashicorp/setup-terraform@v3
      - name: terraform apply client-cc
        working-directory: infra/terraform
        env:
          TF_VAR_project_id:           ${{ vars.GCP_PROJECT_CLIENT_CC }}
          TF_VAR_region:               europe-west2
          TF_VAR_env:                  client-cc
          TF_VAR_image_scoring_api:    ${{ needs.build-push.outputs.image_scoring_api }}
          TF_VAR_image_reconciliation: ${{ needs.build-push.outputs.image_reconciliation }}
          TF_VAR_image_activation:     ${{ needs.build-push.outputs.image_activation }}
          TF_VAR_image_breaker:        ${{ needs.build-push.outputs.image_breaker }}
          TF_VAR_image_ml_pipeline:    ${{ needs.build-push.outputs.image_ml_pipeline }}
          TF_VAR_image_mock_vertex:    ${{ needs.build-push.outputs.image_mock_vertex }}
          TF_VAR_image_dashboard:      ${{ needs.build-push.outputs.image_dashboard }}
        run: |
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_CLIENT_CC }}"
          terraform apply -auto-approve -lock-timeout=5m -var-file=envs/client-cc.tfvars

  deploy-prod:
    needs: [build-push, deploy-staging]
    # Prod opt-in: set repo variable DEPLOY_PROD=true only when prod
    # secrets (GCP_WIF_PROVIDER_PROD, GCP_CI_SA_PROD, GCP_PROJECT_PROD,
    # TF_STATE_BUCKET_PROD) are wired. Until then, prod jobs do not run.
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PROD == 'true'
    runs-on: ubuntu-latest
    environment: prod  # requires GitHub environment approval
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account:            ${{ secrets.GCP_CI_SA_PROD }}
      - uses: hashicorp/setup-terraform@v3
      - name: terraform apply prod
        working-directory: infra/terraform
        env:
          TF_VAR_project_id:           ${{ vars.GCP_PROJECT_PROD }}
          TF_VAR_region:               europe-west2
          TF_VAR_env:                  prod
          TF_VAR_image_scoring_api:    ${{ needs.build-push.outputs.image_scoring_api }}
          TF_VAR_image_reconciliation: ${{ needs.build-push.outputs.image_reconciliation }}
          TF_VAR_image_activation:     ${{ needs.build-push.outputs.image_activation }}
          TF_VAR_image_breaker:        ${{ needs.build-push.outputs.image_breaker }}
          TF_VAR_image_ml_pipeline:    ${{ needs.build-push.outputs.image_ml_pipeline }}
          TF_VAR_image_mock_vertex:    ${{ needs.build-push.outputs.image_mock_vertex }}
          TF_VAR_image_dashboard:      ${{ needs.build-push.outputs.image_dashboard }}
        run: |
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_PROD }}"
          terraform apply -auto-approve -lock-timeout=5m -var-file=envs/prod.tfvars
