# breaker-automation — Cloud Function. PRD §5: automated circuit breaker.
# On rpc-anomaly Pub/Sub event, flip the kill switch by writing a new
# Secret Manager version; scoring-api hot-reloads from Secret Manager.
#
# Also ships the breaker triage agent (ADR 0005): an ADK agent that runs AFTER a
# trip to triage/escalate. The agent deps are an optional `agent` extra so the
# deterministic trip Function image stays lean and adk-free.
[project]
name = "msm-breaker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "functions-framework>=3.8",
    "google-cloud-secret-manager>=2.20",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Triage agent runtime (deployed to Vertex Agent Engine, ADR 0005/0007).
agent = ["google-adk>=1.0", "google-cloud-aiplatform>=1.60"]
dev = ["pytest>=8", "pytest-cov>=5", "import-linter>=2.0"]
# Eval track (ADR 0006) — agent-eval CI job only.
eval = ["google-adk>=1.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
addopts = "--cov=msm_breaker"
testpaths = ["tests"]
