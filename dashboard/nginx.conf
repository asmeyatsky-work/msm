resolver 8.8.8.8 ipv6=off valid=300s;
resolver_timeout 5s;

server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy /api/* → reconciliation Cloud Run service.
  # Cloud Run requires the Host header to match the service hostname (proxy_ssl_server_name + proxy_set_header Host).
  location /api/ {
    set $upstream "${RECONCILIATION_API_HOST}";
    rewrite ^/api/(.*)$ /$1 break;

    proxy_pass https://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $upstream;
    proxy_ssl_server_name on;
    proxy_ssl_name $upstream;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /healthz { return 200 "ok\n"; default_type text/plain; }
}
